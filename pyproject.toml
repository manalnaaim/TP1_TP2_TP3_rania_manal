[tool.ruff]
exclude = [".venv", "notebooks", "kit-tp3", "kit-tp2", "kit-tp5", "kit-tp6", "tp2-semaine2-kit", "tp4-tests-qualite-kit", "tp5-interface-kit", "tp6-packaging-kit", "src", "scripts", "tests/test_cadrage.py", "tests/test_environment.py", "tests/test_git_history.py", "tests/test_model.py", "tests/test_api.py", "tests/test_integration.py", "tests/test_jeu_or.py", "tests/test_limites.py"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["api"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

# --- Packaging (TP6) : le dépôt devient un paquet installable ---------------------------------
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
dynamic = ["version"]
description = "Analyse de sentiment d'avis clients : modèle, API et interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.5,<1.6",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39,<1.40", "pandas>=2.2,<3", "httpx>=0.27,<0.28"]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools]
packages = ["sentiment_app", "api", "ui"]

[tool.setuptools.dynamic]
version = { attr = "sentiment_app.__version__" }